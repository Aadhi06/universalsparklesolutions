<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>USS Admin is offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f4f7fb;
        color: #102342;
        font-family: Manrope, Segoe UI, sans-serif;
      }
      main {
        max-width: 28rem;
      }
      h1 {
        font-size: 1.6rem;
        margin-bottom: 0.5rem;
      }
      p {
        line-height: 1.5;
      }
      button {
        min-height: 48px;
        margin-top: 1rem;
        border: 0;
        border-radius: 6px;
        background: #146dad;
        color: white;
        padding: 0 1.25rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>USS Admin needs a connection to load enquiries and appointments. Try again when you are back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
